name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate before deploy
        run: |
          python -m ruff check .
          python -m mypy app --no-incremental --follow-imports=skip
          python -m pytest -q
      - name: Build image
        run: docker build -f Dockerfile -t tingo-reservas:${{ github.sha }} .
      - name: Deployment configuration required
        run: echo "Configure the cloud provider command and GitHub Actions Secrets before publishing."
